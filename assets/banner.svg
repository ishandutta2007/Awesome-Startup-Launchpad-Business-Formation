<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#030712" />
    </linearGradient>

    <!-- Glowing Accent Gradients -->
    <linearGradient id="primary-glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="50%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>

    <linearGradient id="card-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1f2937" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#111827" stop-opacity="0.6" />
    </linearGradient>

    <!-- Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#374151" stroke-width="0.75" stroke-opacity="0.3" />
    </pattern>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .bg { fill: url(#bg-grad); }
    .grid-layer { fill: url(#grid); }
    
    /* Dynamic background animated pulses */
    @keyframes pulseOrb {
      0%, 100% { transform: scale(1) translate(0, 0); opacity: 0.35; }
      50% { transform: scale(1.18) translate(25px, -15px); opacity: 0.6; }
    }
    @keyframes floatParticle {
      0% { transform: translateY(0px) translateX(0px); opacity: 0.2; }
      50% { transform: translateY(-25px) translateX(15px); opacity: 0.7; }
      100% { transform: translateY(0px) translateX(0px); opacity: 0.2; }
    }
    @keyframes dashCycle {
      0% { stroke-dashoffset: 0; }
      100% { stroke-dashoffset: -120; }
    }

    .orb-1 { animation: pulseOrb 8s ease-in-out infinite; transform-origin: 200px 100px; }
    .orb-2 { animation: pulseOrb 10s ease-in-out infinite reverse; transform-origin: 1000px 240px; }
    .p-1 { animation: floatParticle 5s ease-in-out infinite; }
    .p-2 { animation: floatParticle 7s ease-in-out infinite 1s; }
    .p-3 { animation: floatParticle 6s ease-in-out infinite 2s; }
    .flow-line { stroke-dasharray: 8 6; animation: dashCycle 6s linear infinite; }

    /* Static Foreground Typography to guarantee complete readability */
    .title-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 800;
      font-size: 42px;
      fill: #ffffff;
      letter-spacing: -0.5px;
    }
    .badge-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 600;
      font-size: 13px;
      fill: #a5b4fc;
      text-transform: uppercase;
      letter-spacing: 1.5px;
    }
    .subtitle-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 400;
      font-size: 18px;
      fill: #9ca3af;
    }
    .card-title {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 600;
      font-size: 13px;
      fill: #e0e7ff;
    }
  </style>

  <!-- Background Base -->
  <rect width="1200" height="340" rx="16" class="bg" />
  <rect width="1200" height="340" rx="16" class="grid-layer" />

  <!-- Animated Ambient Lighting Orbs (in deep background) -->
  <circle cx="160" cy="80" r="140" fill="#4f46e5" filter="url(#glow)" class="orb-1" />
  <circle cx="1020" cy="220" r="160" fill="#ec4899" filter="url(#glow)" class="orb-2" />
  <circle cx="680" cy="40" r="100" fill="#06b6d4" filter="url(#glow)" class="orb-1" opacity="0.2" />

  <!-- Dynamic Connecting Flow Lines in Middle Layer -->
  <path d="M 120 270 Q 350 210, 600 275 T 1080 250" fill="none" stroke="url(#primary-glow)" stroke-width="2.5" class="flow-line" opacity="0.45" />
  <path d="M 80 120 Q 420 50, 750 140 T 1120 90" fill="none" stroke="#6366f1" stroke-width="1.5" class="flow-line" opacity="0.25" />

  <!-- Background Floating Visual Markers (Deep Layer) -->
  <circle cx="980" cy="70" r="4" fill="#a5b4fc" class="p-1" />
  <circle cx="1060" cy="140" r="6" fill="#f472b6" class="p-2" />
  <circle cx="890" cy="240" r="5" fill="#38bdf8" class="p-3" />
  <circle cx="140" cy="220" r="5" fill="#818cf8" class="p-2" />

  <!-- FOREGROUND LAYER: Content strictly positioned for crystal-clear readability -->

  <!-- Header Category Pill -->
  <g transform="translate(60, 48)">
    <rect width="280" height="30" rx="15" fill="#1e1b4b" stroke="#6366f1" stroke-width="1.2" opacity="0.95" />
    <circle cx="18" cy="15" r="4.5" fill="#10b981" />
    <text x="32" y="20" class="badge-text">STARTUP ARCHITECTURE &amp; LAW</text>
  </g>

  <!-- Main Title -->
  <g transform="translate(60, 125)">
    <text class="title-text">Awesome Startup Launchpad</text>
    <text x="635" y="0" class="title-text" fill="url(#primary-glow)">&amp; Formation</text>
  </g>

  <!-- Subtitle -->
  <text x="60" y="165" class="subtitle-text">
    The curated launch stack: Top SaaS incorporators, equity platforms, and open-source legal registries
  </text>

  <!-- Visual Feature Cards / Workflow Pipeline (Pills in lower foreground) -->
  <g transform="translate(60, 205)">
    <!-- Stage 1 -->
    <g transform="translate(0, 0)">
      <rect width="245" height="58" rx="10" fill="url(#card-grad)" stroke="#4b5563" stroke-width="1" />
      <rect x="14" y="15" width="28" height="28" rx="6" fill="#4338ca" />
      <text x="23" y="34" font-size="16" fill="#ffffff">🏛️</text>
      <text x="52" y="31" class="card-title">1. Entity Formation</text>
      <text x="52" y="47" font-size="11" fill="#9ca3af" font-family="-apple-system, sans-serif">Delaware C-Corp &amp; LLCs</text>
    </g>

    <!-- Arrow 1 -->
    <path d="M 255 29 L 275 29" stroke="#6366f1" stroke-width="2" marker-end="url(#arrow)" stroke-linecap="round" opacity="0.8" />

    <!-- Stage 2 -->
    <g transform="translate(285, 0)">
      <rect width="245" height="58" rx="10" fill="url(#card-grad)" stroke="#4b5563" stroke-width="1" />
      <rect x="14" y="15" width="28" height="28" rx="6" fill="#0891b2" />
      <text x="23" y="34" font-size="16" fill="#ffffff">📊</text>
      <text x="52" y="31" class="card-title">2. Cap Table &amp; SAFEs</text>
      <text x="52" y="47" font-size="11" fill="#9ca3af" font-family="-apple-system, sans-serif">Equity, Vesting &amp; Dilution</text>
    </g>

    <!-- Arrow 2 -->
    <path d="M 540 29 L 560 29" stroke="#6366f1" stroke-width="2" stroke-linecap="round" opacity="0.8" />

    <!-- Stage 3 -->
    <g transform="translate(570, 0)">
      <rect width="245" height="58" rx="10" fill="url(#card-grad)" stroke="#4b5563" stroke-width="1" />
      <rect x="14" y="15" width="28" height="28" rx="6" fill="#059669" />
      <text x="23" y="34" font-size="16" fill="#ffffff">🏦</text>
      <text x="52" y="31" class="card-title">3. Banking &amp; Tax EIN</text>
      <text x="52" y="47" font-size="11" fill="#9ca3af" font-family="-apple-system, sans-serif">Mercury, Brex &amp; IRS 83(b)</text>
    </g>

    <!-- Arrow 3 -->
    <path d="M 825 29 L 845 29" stroke="#6366f1" stroke-width="2" stroke-linecap="round" opacity="0.8" />

    <!-- Stage 4 -->
    <g transform="translate(855, 0)">
      <rect width="225" height="58" rx="10" fill="url(#card-grad)" stroke="#4b5563" stroke-width="1" />
      <rect x="14" y="15" width="28" height="28" rx="6" fill="#db2777" />
      <text x="23" y="34" font-size="16" fill="#ffffff">📜</text>
      <text x="52" y="31" class="card-title">4. Open Standards</text>
      <text x="52" y="47" font-size="11" fill="#9ca3af" font-family="-apple-system, sans-serif">Open Cap Format &amp; Legal OSS</text>
    </g>
  </g>

  <!-- Bottom Accent Gradient Line -->
  <rect x="0" y="336" width="1200" height="4" fill="url(#primary-glow)" />
</svg>